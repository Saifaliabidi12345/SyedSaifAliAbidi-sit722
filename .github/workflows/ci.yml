name: CI - Build, Test & Push Images

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing
  workflow_dispatch:

env:
  # The full login server (e.g., mysit722acr.azurecr.io)
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_test_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 Node.js setup for frontend build/test
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      # 🔹 Python setup for backend tests
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies (Customer Service as example)
        run: |
          pip install -r backend/customer_service/requirements-dev.txt
          pip install -r backend/order_service/requirements-dev.txt
          pip install -r backend/product_service/requirements-dev.txt

      - name: Run backend tests
        run: pytest backend/

      # 🔹 Azure login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 🔹 Extract registry name (remove .azurecr.io)
      - name: Extract ACR name
        id: acr
        run: echo "name=${ACR_LOGIN_SERVER%%.azurecr.io}" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ steps.acr.outputs.name }}

      # 🔹 Build & push images
      - name: Build and Push Images
        run: |
          BRANCH=${GITHUB_REF##*/}
          if [ "$BRANCH" = "main" ]; then
            TAG="prod-${IMAGE_TAG}"
          else
            TAG="staging-${IMAGE_TAG}"
          fi

          echo "Using image tag: $TAG"

          # Frontend
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:$TAG ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:$TAG

          # Backend services
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/customer-service:$TAG ./backend/customer_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/customer-service:$TAG

          docker build -t ${{ env.ACR_LOGIN_SERVER }}/order-service:$TAG ./backend/order_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/order-service:$TAG

          docker build -t ${{ env.ACR_LOGIN_SERVER }}/product-service:$TAG ./backend/product_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/product-service:$TAG

      - name: Logout from Azure
        run: az logout
        if: always()
