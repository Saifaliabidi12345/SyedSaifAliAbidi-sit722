name: CD - Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (staging or prod)"
        required: true
        default: "staging"
      aks_cluster_name:
        description: "AKS cluster name"
        required: true
        default: "<your-aks-name>"
      aks_resource_group:
        description: "Resource group containing AKS"
        required: true
        default: "<your-rg>"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Extract registry name
      - name: Extract ACR name
        id: acr
        run: echo "name=${ACR_LOGIN_SERVER%%.azurecr.io}" >> $GITHUB_OUTPUT
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Set Kubernetes context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ github.event.inputs.aks_resource_group }}
          cluster-name: ${{ github.event.inputs.aks_cluster_name }}

      - name: Deploy manifests
        run: |
          ENV=${{ github.event.inputs.environment }}
          if [ "$ENV" = "prod" ]; then
            TAG="prod-${GITHUB_SHA}"
          else
            TAG="staging-${GITHUB_SHA}"
          fi

          echo "Deploying with image tag: $TAG"

          cd k8s/

          # Update manifests with correct image tags
          sed -i "s|IMAGE_TAG|$TAG|g" frontend.yaml
          sed -i "s|IMAGE_TAG|$TAG|g" customer-service.yaml
          sed -i "s|IMAGE_TAG|$TAG|g" order-service.yaml
          sed -i "s|IMAGE_TAG|$TAG|g" product-service.yaml

          kubectl apply -f .

      - name: Logout from Azure
        run: az logout
        if: always()
